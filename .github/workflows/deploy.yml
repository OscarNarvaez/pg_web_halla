name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Acciones fijadas por SHA de commit (una etiqueta se puede mover; un SHA no). Dependabot las actualiza.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # La versión de pnpm sale del campo packageManager de package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Pruebas sin red: prompt literal, validación V1–V6, cascada de Gemini, migraciones + RLS y búsqueda
      - name: Pruebas
        run: pnpm probar

      - name: Build
        run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_NOMBRE: halla
          VITE_APP_URL: https://halla.ink

      - name: Verificar el artefacto
        run: |
          test -f dist/CNAME && grep -qx 'halla.ink' dist/CNAME
          test -f dist/404.html
          # La API key de Gemini jamás debe llegar al bundle (formatos AIza… y AQ.…)
          if grep -rqE 'AIza[0-9A-Za-z_-]{20,}|AQ\.[0-9A-Za-z_-]{20,}' dist; then
            echo '::error::Se encontró una API key de Google en dist/'
            exit 1
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
